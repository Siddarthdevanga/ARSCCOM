<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Offline — Hai Visitor</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    color: #fff; text-align: center;
    background:
      radial-gradient(70% 55% at 50% 50%, rgba(245,165,36,.10) 0%, rgba(245,165,36,0) 68%),
      linear-gradient(158deg, #121214 0%, #050505 48%, #0c0c0f 100%);
  }
  .bar {
    position: fixed; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg,#f5a524 0%,#ffc75f 22%,#34d399 48%,#38bdf8 72%,#a78bfa 100%);
  }
  .wrap { max-width: 380px; }
  img { width: 92px; height: auto; margin-bottom: 26px; opacity: .92; }
  h1 { font-size: 1.4rem; font-weight: 800; margin: 0 0 10px; letter-spacing: -.4px; }
  p  { font-size: .93rem; line-height: 1.6; color: rgba(255,255,255,.62); margin: 0 0 26px; }
  button {
    font: inherit; font-weight: 800; font-size: .85rem;
    letter-spacing: .04em; text-transform: uppercase;
    color: #1c1204; cursor: pointer; border: none;
    padding: 13px 30px; border-radius: 10px; min-height: 44px;
    background: linear-gradient(135deg,#ffc75f 0%,#f5a524 48%,#e8900d 100%);
    box-shadow: 0 6px 20px rgba(245,165,36,.4);
  }
</style>
</head>
<body>
  <div class="bar"></div>
  <div class="wrap">
    <img src="/icons/icon-192.png" alt="" />
    <h1>You&rsquo;re offline</h1>
    <p>
      Hai Visitor needs a connection to show live visitor and booking data.
      Check your network and try again.
    </p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
